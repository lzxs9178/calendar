<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 有些环境（公司策略、内嵌浏览器、邮件客户端预览）会拦截内联脚本；
     放开 CSP 让它能正常运行，同时保留对外部资源的限制 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
<title>万年历 · 节日与日程</title>
<meta name="description" content="本地日历程序：内置节日与冷门国际日、农历与二十四节气、可添加备忘录与每年循环的生日纪念日。">
<style>
/* ============================================================
   万年历 · 样式
   浅色 / 深色主题、月视图、年视图、列表视图、移动端适配
   ============================================================ */

:root {
  --bg: #f4f6fb;
  --panel: #ffffff;
  --panel-2: #fafbfe;
  --line: #e3e8f0;
  --line-strong: #cfd7e6;
  --text: #1c2430;
  --text-2: #5b6879;
  --text-3: #93a0b1;
  --primary: #3b6ef5;
  --primary-soft: #eaf0ff;
  --today: #3b6ef5;
  --weekend: #d64545;
  --holiday: #d64545;
  --festival: #b0591f;
  --term: #1f8f6a;
  --event: #3b6ef5;
  --shadow: 0 1px 2px rgba(20, 32, 56, .06), 0 8px 24px rgba(20, 32, 56, .06);
  --radius: 12px;
  --cell-h: 116px;
  --font: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
}

[data-theme="dark"] {
  --bg: #12151c;
  --panel: #1a1f29;
  --panel-2: #202632;
  --line: #2b3342;
  --line-strong: #3a4457;
  --text: #e8edf6;
  --text-2: #a4b0c2;
  --text-3: #6f7d92;
  --primary: #6f9bff;
  --primary-soft: #1e2a45;
  --today: #6f9bff;
  --weekend: #ff7a7a;
  --holiday: #ff8484;
  --festival: #ffb27a;
  --term: #5fd3a6;
  --event: #6f9bff;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35);
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg); color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; color: inherit; }

/* 保证 hidden 永远生效：弹窗与视图靠它切换显隐，不能被别的 display 规则覆盖 */
[hidden] { display: none !important; }
h1, h2, h3 { margin: 0; font-weight: 650; }
.muted { color: var(--text-3); }
.small { font-size: 12px; }
.spacer { flex: 1; }
.dot { color: var(--text-3); margin: 0 6px; }
.hint { color: var(--text-3); font-size: 12.5px; margin: 4px 0 0; line-height: 1.6; }
hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }

/* ---------- 布局 ---------- */
.app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

.topbar {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 16px;
  padding: 10px 18px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.topbar-left { display: flex; align-items: center; gap: 16px; min-width: 0; }
.topbar-right { display: flex; align-items: center; gap: 10px; margin-left: auto; flex-wrap: wrap; }

.brand { display: flex; align-items: center; gap: 9px; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 10px;
  display: grid; place-items: center;
  background: linear-gradient(140deg, var(--primary), #7aa2ff);
  color: #fff; font-weight: 700; font-size: 17px;
}
.brand-text { display: flex; flex-direction: column; line-height: 1.15; font-weight: 650; }
.brand-text small { font-weight: 400; font-size: 11px; color: var(--text-3); }

.nav-arrows { display: flex; align-items: center; gap: 6px; }
.title-block { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.title-block h1 { font-size: 18px; white-space: nowrap; }
.title-block p { margin: 1px 0 0; font-size: 12px; }

.segmented { display: flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 2px; }
.seg {
  border: 0; background: transparent; padding: 5px 14px; border-radius: 8px;
  cursor: pointer; color: var(--text-2); font-size: 13px;
}
.seg[aria-selected="true"] { background: var(--panel); color: var(--text); box-shadow: var(--shadow); font-weight: 600; }

.search-wrap input {
  width: 190px; padding: 7px 12px; border-radius: 10px;
  border: 1px solid var(--line-strong); background: var(--panel-2); outline: none;
}
.search-wrap input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }

.btn {
  border: 1px solid var(--line-strong); background: var(--panel);
  padding: 7px 14px; border-radius: 10px; cursor: pointer;
  transition: .15s; white-space: nowrap;
}
.btn:hover { border-color: var(--primary); color: var(--primary); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); color: #fff; }
.btn.ghost { background: transparent; }
.btn.danger { color: #d64545; border-color: #f0c4c4; }
.btn.danger:hover { background: #fdeded; border-color: #d64545; }
.btn.icon-btn, .icon-btn {
  border: 1px solid var(--line-strong); background: var(--panel);
  width: 32px; height: 32px; border-radius: 9px; cursor: pointer;
  display: grid; place-items: center; font-size: 17px; line-height: 1; color: var(--text-2);
}
.icon-btn:hover { border-color: var(--primary); color: var(--primary); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

.body {
  flex: 1 1 auto; display: grid;
  grid-template-columns: minmax(0, 1fr) 330px;
  min-height: 0;
}
.main { min-width: 0; display: flex; flex-direction: column; padding: 12px 14px 0; overflow: hidden; }

/* ---------- 月视图 ---------- */
.weekdays {
  display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 6px; padding: 0 0 8px;
}
.weekdays.with-weekno { grid-template-columns: 34px repeat(7, minmax(0, 1fr)); }
.weekdays span { text-align: center; font-size: 12px; color: var(--text-2); font-weight: 600; }
.weekdays span.wk-end { color: var(--weekend); }

.grid {
  flex: 1 1 auto; display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  grid-auto-rows: minmax(0, 1fr);
  gap: 6px; padding-bottom: 12px; min-height: 0;
}
.grid.with-weekno { grid-template-columns: 34px repeat(7, minmax(0, 1fr)); }

.weekno {
  display: grid; place-items: center; font-size: 11px; color: var(--text-3);
  background: var(--panel-2); border-radius: 8px; border: 1px dashed var(--line);
}

.day {
  position: relative; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 6px 7px 5px; min-height: 0; overflow: hidden;
  display: flex; flex-direction: column; gap: 3px; cursor: pointer;
  transition: .12s;
}
.day:hover { border-color: var(--primary); box-shadow: var(--shadow); }
.day.other { background: var(--panel-2); opacity: .62; }
.day.today { border-color: var(--today); box-shadow: inset 0 0 0 1px var(--today); }
.day.selected { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft); }
.day.match { border-color: #e0a300; box-shadow: 0 0 0 2px #ffe9b0 inset; }

.day-top { display: flex; align-items: baseline; gap: 5px; }
.day-top-right { margin-left: auto; display: flex; align-items: center; gap: 4px; min-width: 0; }
.day-num { font-size: 17px; font-weight: 650; letter-spacing: -.2px; }
.day.today .day-num { color: #fff; background: var(--today); border-radius: 8px; padding: 0 6px; }
.day.weekend .day-num { color: var(--weekend); }
.day.today.weekend .day-num { color: #fff; }
.day-lunar { font-size: 11px; color: var(--text-3); margin-left: auto; white-space: nowrap; }
.day-lunar.term { color: var(--term); font-weight: 600; }
.day-lunar.holiday { color: var(--holiday); font-weight: 600; }

.chips { display: flex; flex-direction: column; gap: 3px; overflow: hidden; }
.chip {
  display: block; font-size: 11.5px; line-height: 1.5;
  padding: 1px 6px; border-radius: 6px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
  background: var(--panel-2); border-left: 3px solid var(--line-strong); color: var(--text-2);
  text-align: left; cursor: pointer;
}
.chip:hover { background: var(--primary-soft); }
.chip.festival { color: var(--festival); border-left-color: var(--festival); background: #fdf4ec; }
.chip.term { color: var(--term); border-left-color: var(--term); background: #ecf8f3; }
.chip.holiday { color: var(--holiday); border-left-color: var(--holiday); background: #fdeded; font-weight: 600; }
.chip.user { color: var(--event); border-left-color: var(--event); background: var(--primary-soft); font-weight: 550; }
.chip.more { color: var(--text-3); background: transparent; border-left-color: transparent; cursor: default; }
[data-theme="dark"] .chip.festival { background: #2a2118; }
[data-theme="dark"] .chip.term { background: #16281f; }
[data-theme="dark"] .chip.holiday { background: #2c1a1a; }

.badge-bd {
  display: inline-grid; place-items: center; min-width: 15px; height: 15px;
  padding: 0 3px; border-radius: 5px; font-size: 10px; font-weight: 700;
  background: #ffe0e6; color: #c2185b; margin-right: 3px;
}
[data-theme="dark"] .badge-bd { background: #3a1f2b; color: #ff9ec0; }

/* ---------- 黄历 ---------- */
.luck-dot {
  font-size: 9px; line-height: 1.3; padding: 0 3px; border-radius: 4px;
  background: #fff3d6; color: #a3690a; border: 1px solid #f0d69a; font-weight: 700;
  flex: 0 0 auto;
}
[data-theme="dark"] .luck-dot { background: #33290f; color: #ffcf6b; border-color: #5a4718; }

.almanac {
  background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px;
}
.alm-line { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
.alm-gz { font-size: 12.5px; color: var(--text-2); letter-spacing: .5px; }
.alm-act { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; margin-top: 7px; }
.alm-tag {
  flex: 0 0 auto; width: 22px; height: 22px; border-radius: 6px;
  display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff;
}
.alm-tag.yi { background: #2f9e6b; }
.alm-tag.ji { background: #cf4b4b; }
.alm-item {
  font-size: 12px; padding: 1px 8px; border-radius: 6px;
  background: var(--panel); border: 1px solid var(--line); color: var(--text-2);
}
.almanac .pill.alm-yellow { color: #a3690a; border-color: #f0d69a; background: #fff8e8; font-weight: 700; }
.almanac .pill.alm-black { color: var(--text-3); }
.almanac .pill.alm-taboo { color: #b32020; border-color: #f0bcbc; background: #fdeded; font-weight: 650; }
.almanac .pill.alm-minor { color: var(--festival); border-color: currentColor; }
[data-theme="dark"] .almanac .pill.alm-yellow { background: #33290f; border-color: #5a4718; color: #ffcf6b; }

.today-almanac {
  margin-top: 9px; padding-top: 8px; border-top: 1px solid rgba(255, 255, 255, .25);
}
.today-almanac .alm-item {
  font-size: 11.5px; background: rgba(255, 255, 255, .18);
  border-color: transparent; color: #fff;
}
.today-almanac .alm-tag { width: 20px; height: 20px; font-size: 12px; }
.today-almanac .alm-tag.yi { background: #4bd39a; color: #0d3b28; }
.today-almanac .alm-tag.ji { background: #ffb0b0; color: #5c1616; }

/* ---------- 历史上的今天 ---------- */
.history-box {
  background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 6px 10px; max-height: 320px; overflow: auto;
}
.hist-item {
  display: flex; gap: 8px; align-items: baseline;
  padding: 5px 0; border-bottom: 1px dashed var(--line); font-size: 13px;
}
.hist-item:last-child { border-bottom: 0; }
.hist-year {
  flex: 0 0 46px; text-align: right; font-weight: 700; font-size: 12.5px;
  color: var(--primary); font-variant-numeric: tabular-nums;
}
.hist-text { flex: 1; min-width: 0; line-height: 1.6; color: var(--text-2); }
.hist-kind {
  display: inline-block; font-size: 10.5px; padding: 0 5px; border-radius: 4px;
  margin-right: 5px; vertical-align: 1px;
}
.hist-kind.birth { background: #e6f6ee; color: #1c7a52; }
.hist-kind.death { background: #f2eeee; color: #6b5555; }
[data-theme="dark"] .hist-kind.birth { background: #17342a; color: #6fd3a6; }
[data-theme="dark"] .hist-kind.death { background: #2a2424; color: #b09393; }
.hist-cat {
  flex: 0 0 auto; font-size: 10.5px; padding: 1px 6px; border-radius: 999px;
  border: 1px solid currentColor; opacity: .85;
}
.h-mil { color: #b3543f; }
.h-pol { color: #4a63b8; }
.h-sci { color: #1f8f6a; }
.h-dis { color: #a2680f; }
.h-cul { color: #8b52a8; }
.h-rel { color: #7b6a4a; }
.h-edu { color: #2e7f9e; }
.h-other { color: var(--text-3); }

/* ---------- 年视图 ---------- */
.view-host { flex: 1 1 auto; overflow: auto; padding-bottom: 16px; min-height: 0; }
.year-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(216px, 1fr)); gap: 12px; }
.mini {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 9px 10px 10px; cursor: pointer; transition: .12s;
}
.mini:hover { border-color: var(--primary); box-shadow: var(--shadow); }
.mini.current { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.mini h3 { font-size: 13.5px; margin-bottom: 6px; display: flex; align-items: baseline; gap: 6px; }
.mini h3 small { font-weight: 400; color: var(--text-3); font-size: 11px; }
.mini-head, .mini-row { display: grid; grid-template-columns: repeat(7, 1fr); }
.mini-head span { text-align: center; font-size: 10px; color: var(--text-3); }
.mini-cell {
  position: relative; aspect-ratio: 1 / 1; display: grid; place-items: center;
  font-size: 11px; color: var(--text-2); border-radius: 6px;
}
.mini-cell.out { visibility: hidden; }
.mini-cell.term { color: var(--term); font-weight: 700; }
.mini-cell.fest { color: var(--festival); font-weight: 650; }
.mini-cell.holiday { color: #fff; background: var(--holiday); font-weight: 700; }
.mini-cell.today { box-shadow: inset 0 0 0 1.5px var(--today); color: var(--today); font-weight: 700; }
.mini-cell.user::after {
  content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
  width: 4px; height: 4px; border-radius: 50%; background: var(--event);
}
.mini-cell.user.fest::after, .mini-cell.user.holiday::after { background: #fff; }

/* ---------- 列表视图 ---------- */
.list-wrap { max-width: 860px; margin: 0 auto; }
.list-group-title {
  font-size: 12.5px; color: var(--text-3); font-weight: 600;
  margin: 16px 2px 7px; display: flex; align-items: center; gap: 8px;
}
.list-group-title::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.row {
  display: flex; align-items: flex-start; gap: 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 13px; margin-bottom: 7px; transition: .12s;
}
.row:hover { border-color: var(--primary); }
.row-date {
  flex: 0 0 62px; text-align: center; border-right: 1px solid var(--line); padding-right: 10px;
}
.row-date b { display: block; font-size: 16px; }
.row-date small { color: var(--text-3); font-size: 11px; }
.row-main { flex: 1; min-width: 0; }
.row-main b { font-size: 14px; }
.row-main p { margin: 3px 0 0; font-size: 12.5px; color: var(--text-2); }
.row-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
.tag {
  font-size: 11px; padding: 1px 7px; border-radius: 999px;
  background: var(--panel-2); border: 1px solid var(--line); color: var(--text-2);
}
.tag.cat { background: var(--primary-soft); border-color: transparent; color: var(--primary); }
.row-actions { display: flex; gap: 4px; align-items: center; }
.empty { text-align: center; color: var(--text-3); padding: 40px 10px; }

/* ---------- 侧栏 ---------- */
.sidebar {
  border-left: 1px solid var(--line); background: var(--panel);
  overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px;
}
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.card-head {
  display: flex; align-items: baseline; gap: 8px;
  padding: 10px 12px 8px; border-bottom: 1px solid var(--line);
}
.card-head h2 { font-size: 13.5px; }
.card-body { padding: 10px 12px 12px; }

.today-card { background: linear-gradient(150deg, var(--primary), #6d97ff); border: 0; color: #fff; }
.today-card .card-body { padding: 13px 14px 14px; }
.today-card .big { font-size: 30px; font-weight: 700; line-height: 1.1; }
.today-card .sub { opacity: .92; font-size: 12.5px; margin-top: 3px; }
.today-card .lunar { opacity: .95; font-size: 13px; margin-top: 9px; display: flex; gap: 8px; flex-wrap: wrap; }
.today-card .pill {
  background: rgba(255, 255, 255, .2); border-radius: 999px; padding: 2px 9px; font-size: 12px;
}

.mini-row-item {
  display: flex; align-items: center; gap: 9px; padding: 6px 0;
  border-bottom: 1px dashed var(--line);
}
.mini-row-item:last-child { border-bottom: 0; }
.mini-row-item .d {
  flex: 0 0 40px; text-align: center; font-size: 12px; color: var(--text-2); line-height: 1.25;
}
.mini-row-item .d b { display: block; font-size: 15px; color: var(--text); }
.mini-row-item .t { flex: 1; min-width: 0; }
.mini-row-item .t b { font-weight: 550; font-size: 13px; }
.mini-row-item .t small { display: block; color: var(--text-3); font-size: 11.5px; }
.mini-row-item .cd {
  font-size: 11px; color: var(--text-3); white-space: nowrap; text-align: right;
}
.mini-row-item .cd b { color: var(--primary); font-size: 13px; }
.quick-add { display: flex; gap: 6px; margin-bottom: 8px; }
.quick-add input {
  flex: 1; padding: 6px 10px; border-radius: 9px;
  border: 1px solid var(--line-strong); background: var(--panel-2); outline: none; min-width: 0;
}

/* ---------- 状态栏 ---------- */
.statusbar {
  flex: 0 0 auto; display: flex; align-items: center;
  padding: 7px 18px; font-size: 12px; color: var(--text-2);
  background: var(--panel); border-top: 1px solid var(--line);
}

/* ---------- 弹窗 ---------- */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 18px; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(12, 18, 30, .45); backdrop-filter: blur(2px); }
.modal-card {
  position: relative; width: min(560px, 100%); max-height: 90vh; overflow: auto;
  background: var(--panel); border-radius: 16px; box-shadow: 0 20px 60px rgba(10, 18, 34, .3);
  border: 1px solid var(--line);
}
.modal-card.narrow { width: min(440px, 100%); }
.modal-head {
  display: flex; align-items: center; padding: 14px 16px;
  border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 2;
}
.modal-head h2 { font-size: 16px; }
.modal-head .icon-btn { margin-left: auto; }
.modal-body { padding: 16px; }
.modal-foot { display: flex; gap: 8px; align-items: center; margin-top: 18px; }

.field { display: block; margin-bottom: 13px; }
.field .label { display: block; font-size: 12.5px; color: var(--text-2); margin-bottom: 5px; font-weight: 550; }
.field .label em { color: var(--holiday); font-style: normal; }
.field input[type="text"], .field input[type="date"], .field input[type="search"],
.field select, .field textarea {
  width: 100%; padding: 8px 11px; border-radius: 10px;
  border: 1px solid var(--line-strong); background: var(--panel-2); outline: none;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft);
}
.field textarea { resize: vertical; }
.field input[type="color"] { width: 100%; height: 38px; padding: 3px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--panel-2); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
.switch { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; }
.switch input { width: 17px; height: 17px; accent-color: var(--primary); }

.festival-search input {
  width: 100%; padding: 8px 11px; border-radius: 10px; margin: 8px 0;
  border: 1px solid var(--line-strong); background: var(--panel-2); outline: none;
}
.festival-result { max-height: 240px; overflow: auto; }
.festival-item {
  display: flex; align-items: baseline; gap: 8px; padding: 6px 2px; border-bottom: 1px dashed var(--line);
  font-size: 13px;
}
.festival-item .when { flex: 0 0 74px; color: var(--text-3); font-size: 11.5px; }
.festival-item .nm { flex: 1; }

.day-detail-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.day-detail-head .big { font-size: 26px; font-weight: 700; }
.section-label {
  font-size: 12px; color: var(--text-3); font-weight: 600; margin: 14px 0 6px;
}
.pill-list { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  font-size: 12px; padding: 3px 10px; border-radius: 999px;
  background: var(--panel-2); border: 1px solid var(--line);
}
.pill.term { color: var(--term); border-color: currentColor; }
.pill.festival { color: var(--festival); border-color: currentColor; }
.pill.holiday { color: var(--holiday); border-color: currentColor; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
  background: #1c2430; color: #fff; padding: 9px 18px; border-radius: 999px;
  font-size: 13px; z-index: 100; box-shadow: 0 8px 24px rgba(0, 0, 0, .3);
  animation: fadeUp .18s ease-out;
}
[data-theme="dark"] .toast { background: #e8edf6; color: #12151c; }
@keyframes fadeUp { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* ---------- 紧凑模式 ---------- */
.dense { --cell-h: 92px; }
.dense .day { padding: 4px 6px; gap: 2px; }
.dense .day-num { font-size: 15px; }
.dense .chip { font-size: 11px; padding: 0 5px; }

/* ---------- 移动端 ---------- */
.mobile-panel { display: none; }
@media (max-width: 1180px) {
  .body { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
}
@media (max-width: 900px) {
  .topbar { padding: 9px 12px; gap: 10px; }
  .brand-text small { display: none; }
  .search-wrap input { width: 130px; }
  .title-block h1 { font-size: 16px; }
  .main { padding: 8px 8px 0; overflow: auto; }
  .grid { grid-auto-rows: minmax(74px, auto); gap: 4px; }
  .day { border-radius: 8px; padding: 4px 5px; }
  .day-num { font-size: 14px; }
  .day-lunar { font-size: 10px; }
  .chip { font-size: 10.5px; padding: 0 4px; border-left-width: 2px; }
  .mobile-panel { display: block; padding: 14px 4px 24px; }
  .view-host { overflow: visible; }
  .field-row, .settings-grid { grid-template-columns: 1fr; }
  .statusbar { font-size: 11px; padding: 6px 12px; }
  #statusHint { display: none; }
}
@media print {
  .topbar, .sidebar, .statusbar, .mobile-panel { display: none !important; }
  .body { display: block; }
  .app { height: auto; overflow: visible; }
  .grid { grid-auto-rows: auto; }
  .day { min-height: 90px; break-inside: avoid; }
}

</style>
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <div class="topbar-left">
      <div class="brand">
        <span class="brand-mark">历</span>
        <span class="brand-text">万年历<small>节日 · 农历 · 日程</small></span>
      </div>
      <nav class="nav-arrows" aria-label="月份导航">
        <button class="icon-btn" id="btnPrev" title="上一月 (←)">‹</button>
        <button class="btn ghost" id="btnToday" title="回到今天 (T)">今天</button>
        <button class="icon-btn" id="btnNext" title="下一月 (→)">›</button>
      </nav>
      <div class="title-block">
        <h1 id="viewTitle">2025 年 1 月</h1>
        <p id="viewSubtitle" class="muted"></p>
      </div>
    </div>
    <div class="topbar-right">
      <div class="segmented" role="tablist" aria-label="视图切换">
        <button class="seg" data-view="month" role="tab" aria-selected="true">月</button>
        <button class="seg" data-view="year" role="tab" aria-selected="false">年</button>
        <button class="seg" data-view="list" role="tab" aria-selected="false">列表</button>
      </div>
      <div class="search-wrap">
        <input type="search" id="searchInput" placeholder="搜索日程 / 节日…" aria-label="搜索">
      </div>
      <button class="btn primary" id="btnAdd" title="新建日程 (N)">＋ 新建</button>
      <button class="btn ghost" id="btnData" title="数据管理">数据</button>
    </div>
  </header>

  <div class="body">
    <main class="main" id="main">
      <div class="weekdays" id="weekdays"></div>
      <div class="grid" id="grid" role="grid" aria-label="月历"></div>
      <div class="view-host" id="viewHost" hidden></div>
      <section class="mobile-panel" id="mobilePanel"></section>
    </main>

    <aside class="sidebar" id="sidebar">
      <section class="card today-card" id="todayCard"></section>
      <section class="card">
        <div class="card-head">
          <h2>即将到来</h2>
          <span class="muted small" id="upcomingCount"></span>
        </div>
        <div class="card-body" id="upcomingList"></div>
      </section>
      <section class="card">
        <div class="card-head">
          <h2 id="monthPanelTitle">本月节日与日程</h2>
        </div>
        <div class="card-body" id="monthPanel"></div>
      </section>
    </aside>
  </div>

  <footer class="statusbar">
    <span id="statusCount"></span>
    <span class="dot">·</span>
    <span id="statusHint">点击日期格子添加日程；拖动或使用 ← → 切换月份</span>
    <span class="spacer"></span>
    <span id="statusRange" class="muted"></span>
  </footer>
</div>

<!-- 日程编辑弹窗 -->
<div class="modal" id="modal" hidden>
  <div class="modal-backdrop" data-close="1"></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header class="modal-head">
      <h2 id="modalTitle">新建日程</h2>
      <button class="icon-btn" data-close="1" title="关闭 (Esc)">×</button>
    </header>
    <form id="eventForm" class="modal-body">
      <input type="hidden" id="fId">
      <label class="field">
        <span class="label">标题 <em>*</em></span>
        <input type="text" id="fTitle" required maxlength="60" placeholder="例如：小林生日 / 交房租 / 体检">
      </label>

      <div class="field-row">
        <label class="field">
          <span class="label">类型</span>
          <select id="fCategory">
            <option value="memo">备忘录</option>
            <option value="birthday">生日</option>
            <option value="anniversary">纪念日</option>
            <option value="todo">待办</option>
            <option value="holiday">自定义节日</option>
          </select>
        </label>
        <label class="field">
          <span class="label">日期类型</span>
          <select id="fCalendar">
            <option value="solar">公历</option>
            <option value="lunar">农历</option>
          </select>
        </label>
      </div>

      <div class="field-row">
        <label class="field">
          <span class="label">日期</span>
          <input type="date" id="fDate" required>
        </label>
        <label class="field">
          <span class="label">重复</span>
          <select id="fRepeat">
            <option value="none">仅此一次</option>
            <option value="yearly">每年重复（生日/纪念日）</option>
            <option value="monthly">每月重复</option>
            <option value="weekly">每周重复</option>
            <option value="lunarYearly">农历每年（农历生日）</option>
            <option value="lunarMonthly">农历每月</option>
          </select>
        </label>
      </div>

      <p class="hint" id="fPreview"></p>

      <label class="field">
        <span class="label">标签（逗号分隔）</span>
        <input type="text" id="fTags" placeholder="家人, 重要">
      </label>

      <label class="field">
        <span class="label">备注</span>
        <textarea id="fNote" rows="3" placeholder="礼物想法、电话、地址…"></textarea>
      </label>

      <div class="field-row">
        <label class="field">
          <span class="label">颜色</span>
          <input type="color" id="fColor" value="#4c8bf5" disabled>
        </label>
        <label class="field">
          <span class="label">提前提醒</span>
          <select id="fRemind">
            <option value="0">不提醒</option>
            <option value="1">提前 1 天</option>
            <option value="3">提前 3 天</option>
            <option value="7">提前 7 天</option>
            <option value="14">提前 14 天</option>
            <option value="30">提前 30 天</option>
          </select>
        </label>
      </div>
      <label class="switch" style="margin-top:-6px">
        <input type="checkbox" id="fAutoColor" checked><span>跟随主题配色</span>
      </label>

      <div class="modal-foot">
        <button type="button" class="btn danger ghost" id="btnDelete" hidden>删除</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close="1">取消</button>
        <button type="submit" class="btn primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- 数据管理弹窗 -->
<div class="modal" id="dataModal" hidden>
  <div class="modal-backdrop" data-close="1"></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="dataTitle">
    <header class="modal-head">
      <h2 id="dataTitle">数据与设置</h2>
      <button class="icon-btn" data-close="1" title="关闭">×</button>
    </header>
    <div class="modal-body">
      <div class="settings-grid">
        <label class="switch"><input type="checkbox" id="setLunar" checked><span>显示农历与节气</span></label>
        <label class="switch"><input type="checkbox" id="setAlmanac" checked><span>显示黄历（黄道吉日 / 宜忌）</span></label>
        <label class="switch"><input type="checkbox" id="setHistory" checked><span>显示「历史上的今天」</span></label>
        <label class="switch"><input type="checkbox" id="setFestivals" checked><span>显示内置节日</span></label>
        <label class="switch"><input type="checkbox" id="setRare" checked><span>显示冷门节日</span></label>
        <label class="switch"><input type="checkbox" id="setWeekStart"><span>周一作为每周第一天</span></label>
        <label class="switch"><input type="checkbox" id="setWeekNumbers"><span>显示周序号</span></label>
        <label class="switch"><input type="checkbox" id="setDense"><span>紧凑显示</span></label>
      </div>
      <hr>
      <h3>备份与迁移</h3>
      <div class="btn-row">
        <button class="btn" id="btnExport">导出 JSON 文件</button>
        <button class="btn" id="btnExportCsv">导出 CSV</button>
        <label class="btn" for="importFile">导入 JSON</label>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
        <button class="btn" id="btnDemo">载入示例数据</button>
        <button class="btn danger ghost" id="btnClear">清空全部日程</button>
      </div>
      <p class="hint">数据只保存在本机浏览器（localStorage）。换设备时请用“导出 JSON”把文件带走。</p>
      <hr>
      <h3>节日库</h3>
      <p class="hint" id="festivalStat"></p>
      <div class="festival-search">
        <input type="search" id="festivalQuery" placeholder="查节日，例如 小狗 / 湿地 / 冬至">
      </div>
      <div id="festivalResult" class="festival-result"></div>
    </div>
  </div>
</div>

<!-- 某一天的详情弹窗 -->
<div class="modal" id="dayModal" hidden>
  <div class="modal-backdrop" data-close="1"></div>
  <div class="modal-card narrow" role="dialog" aria-modal="true" aria-labelledby="dayTitle">
    <header class="modal-head">
      <h2 id="dayTitle">日期详情</h2>
      <button class="icon-btn" data-close="1" title="关闭">×</button>
    </header>
    <div class="modal-body" id="dayBody"></div>
  </div>
</div>

<script>
/* 启动自检：放在所有脚本之前，且只能用 ES5 语法写，
 * 这样即使旧浏览器不支持新语法，也能看到明确提示而不是一片空白。 */
(function () {
  function show(title, html) {
    try {
      if (document.getElementById('__bootmsg')) return;
      var d = document.createElement('div');
      d.id = '__bootmsg';
      d.setAttribute('style', 'position:fixed;left:0;right:0;top:0;z-index:9999;background:#fff4f4;color:#7a1f1f;border-bottom:2px solid #d64545;padding:14px 18px;font:14px/1.7 system-ui,"Microsoft YaHei",sans-serif');
      d.innerHTML = '<b>' + title + '</b><br>' + html;
      document.body.appendChild(d);
    } catch (e) { /* 连提示都做不出来就只能作罢 */ }
  }

  try {
    if (!window.JSON || !document.addEventListener || !window.addEventListener) {
      show('浏览器版本过旧', '本日历需要 IE9 以上的现代浏览器（推荐 Chrome / Edge / Firefox 最新版）。');
      return;
    }
  } catch (e) {}

  setTimeout(function () {
    try {
      var day = document.querySelector('#grid .day');
      var cal = window.__calendar;
      if (day && cal) return;                 // 正常启动，什么都不做
      var detail = [];
      if (!cal) detail.push('· 核心脚本没有执行完成（可能是浏览器拦截了本地脚本，或脚本中途出错）');
      if (!day) detail.push('· 日历网格没有生成');
      if (window.__calendarError) detail.push('· 捕获到的错误：<code>' + String(window.__calendarError) + '</code>');
      show('页面没能正常启动', detail.join('<br>') +
        '<br>可以试试：① 换用 Chrome / Edge / Firefox 打开；② 打开同目录下的 <code>calendar.html</code>（自包含单文件，不依赖外部脚本）；' +
        '③ 在本目录执行 <code>python -m http.server 8000</code>，再访问 <code>http://localhost:8000/</code>。');
    } catch (e) {}
  }, 5000);
})();
</script>

      else if (it.diff === 1) cd.innerHTML = '<b>明天</b>';
      else cd.innerHTML = '<b>' + it.diff + '</b> 天后';
      row.appendChild(cd);

      row.addEventListener('click', function () { openEditor(it.ev); });
      row.style.cursor = 'pointer';
      host.appendChild(row);
    });
  }

  function renderMonthPanel() {
    var host = $('monthPanel');
    host.innerHTML = '';
    var y = state.year, m = state.month;
    $('monthPanelTitle').textContent = m + ' 月节日与日程';
    var days = L.solarMonthDays(y, m);
    var rows = [];

    for (var d = 1; d <= days; d++) {
      var dt = new Date(y, m - 1, d);
      var key = ES.keyOf(dt);
      var evs = userEventsOn(key);
      var fests = visibleFestivals(dt);
      if (!evs.length && !fests.length) continue;
      // 排序优先级：用户生日 > 法定假期 > 用户其他 > 节气 > 其他节日
      var weight = 9;
      if (evs.some(function (e) { return e.category === 'birthday'; })) weight = 0;
      else if (fests.some(function (f) { return (f.tags || []).indexOf('法定假期') >= 0; })) weight = 1;
      else if (evs.length) weight = 2;
      else if (fests.some(function (f) { return f.cat === '节气'; })) weight = 3;
      else weight = 4;
      rows.push({ day: d, key: key, evs: evs, fests: fests, weight: weight });
    }
    rows.sort(function (a, b) { return a.weight - b.weight || a.day - b.day; });

    if (!rows.length) {
      host.appendChild(el('p', 'hint', '本月没有节日与日程记录。'));
      return;
    }
    rows.slice(0, 40).forEach(function (r) {
      var row = el('div', 'mini-row-item');
      var dbox = el('div', 'd');
      dbox.appendChild(el('b', '', String(r.day)));
      dbox.appendChild(el('small', '', '周' + WEEK_CN[new Date(r.key.replace(/-/g, '/')).getDay()]));
      row.appendChild(dbox);

      var t = el('div', 't');
      var names = [];
      r.evs.forEach(function (e) { names.push((e.category === 'birthday' ? '🎂 ' : '') + e.title); });
      r.fests.slice(0, 3).forEach(function (f) { names.push(f.name); });
      t.appendChild(el('b', '', names.slice(0, 2).join(' · ')));
      if (names.length > 2) t.appendChild(el('small', '', '还有 ' + (names.length - 2) + ' 项：' + names.slice(2, 5).join('、')));
      else if (r.fests.length && r.fests[0].note) t.appendChild(el('small', '', r.fests[0].note));
      row.appendChild(t);
      row.style.cursor = 'pointer';
      row.addEventListener('click', function () {
        state.selected = r.key;
        openDay(r.key);
      });
      host.appendChild(row);
    });
  }

  function renderMobilePanel() {

    head.appendChild(el('h2', '', '即将到来'));

  /* ---------------- 年视图 ---------------- */
  function renderYear() {
    var host = $('viewHost');
    host.innerHTML = '';
    var wrap = el('div', 'year-grid');
    var todayKey = ES.todayKey();
    var q = state.query.trim().toLowerCase();

    for (var m = 1; m <= 12; m++) {
      var mini = el('div', 'mini');
      if (m === state.month) mini.classList.add('current');
      var head = el('h3');
      head.appendChild(document.createTextNode(m + ' 月'));
      var l15 = L.fromSolar(state.year, m, 15);
      if (l15) head.appendChild(el('small', '', l15.animal + '年'));
      mini.appendChild(head);

      var wk = el('div', 'mini-head');
      for (var i = 0; i < 7; i++) wk.appendChild(el('span', '', WEEK_CN[(i + state.settings.weekStart) % 7]));
      mini.appendChild(wk);

      var body = el('div', 'mini-row');
      var cells = L.monthGrid(state.year, m, state.settings.weekStart);
      cells.forEach(function (dt) {
        var c = el('div', 'mini-cell');
        if (dt.getMonth() !== m - 1) { c.classList.add('out'); body.appendChild(c); return; }
        c.textContent = String(dt.getDate());
        var key = ES.keyOf(dt);
        if (key === todayKey) c.classList.add('today');
        var fests = visibleFestivals(dt);
        var hasHoliday = fests.some(function (f) { return (f.tags || []).indexOf('法定假期') >= 0; });
        var hasTerm = fests.some(function (f) { return f.cat === '节气'; });
        if (hasHoliday) c.classList.add('holiday');
        else if (fests.length) c.classList.add('fest');
        else if (hasTerm) c.classList.add('term');
        var evs = userEventsOn(key);
        if (evs.length) c.classList.add('user');
        if (q) {
          var text = fests.map(function (f) { return f.name; }).concat(evs.map(function (e) { return e.title; })).join(' ').toLowerCase();
          if (text.indexOf(q) >= 0) c.classList.add('match');
          if (c.classList.contains('match')) c.style.outline = '2px solid #e0a300';
        }
        c.title = fests.map(function (f) { return f.name; }).concat(evs.map(function (e) { return e.title; })).join(' · ');
        c.addEventListener('click', function (e) {
          e.stopPropagation();
          state.year = dt.getFullYear(); state.month = dt.getMonth() + 1; state.selected = key;
          setView('month');
        });
        body.appendChild(c);
      });
      mini.appendChild(body);
      mini.addEventListener('click', function () {
        state.month = m;
        setView('month');
      });
      wrap.appendChild(mini);
    }
    host.appendChild(wrap);
  }

  /* ---------------- 列表视图 ---------------- */
  function renderList() {
    var host = $('viewHost');
    host.innerHTML = '';
    var wrap = el('div', 'list-wrap');
    var q = state.query.trim().toLowerCase();

    // 1) 未来 90 天发生的事
    var from = ES.todayKey();
    var to = ES.keyOfDayNo(ES.dayNoOf(from) + 90);
    var occurrences = [];
    state.events.forEach(function (ev) {
      ES.occurrencesInRange(ev, from, to).forEach(function (k) {
        occurrences.push({ ev: ev, key: k, diff: ES.dayNoOf(k) - ES.dayNoOf(from) });
      });
    });
    // 未来 90 天内没有、但有下次发生的，补在末尾
    state.events.forEach(function (ev) {
      if (occurrences.some(function (o) { return o.ev.id === ev.id; })) return;
      var next = ES.nextOccurrence(ev, from, 3660);
      if (next) occurrences.push({ ev: ev, key: next, diff: ES.dayNoOf(next) - ES.dayNoOf(from) });
    });
    occurrences.sort(function (a, b) { return a.diff - b.diff || ES.compare(a.ev, b.ev); });
    if (q) {
      occurrences = occurrences.filter(function (o) {
        return (o.ev.title + ' ' + o.ev.note + ' ' + (o.ev.tags || []).join(' ')).toLowerCase().indexOf(q) >= 0;
      });
    }

    wrap.appendChild(el('div', 'list-group-title', '我的日程（' + occurrences.length + '）'));
    if (!occurrences.length) {
      wrap.appendChild(el('div', 'empty', q ? '没有匹配“' + state.query + '”的日程' : '还没有日程，点击右上角“新建”开始记录'));
    }
    occurrences.slice(0, 300).forEach(function (o) {
      wrap.appendChild(listRow(o.ev, o.key, o.diff));
    });

    // 2) 本月的节日
    wrap.appendChild(el('div', 'list-group-title', state.year + ' 年 ' + state.month + ' 月节日'));
    var count = 0;
    for (var d = 1; d <= L.solarMonthDays(state.year, state.month); d++) {
      var dt = new Date(state.year, state.month - 1, d);
      var fests = visibleFestivals(dt);
      if (q) fests = fests.filter(function (f) { return f.name.toLowerCase().indexOf(q) >= 0; });
      fests.forEach(function (f) {
        count++;
        var row = el('div', 'row');
        var rd = el('div', 'row-date');
        rd.appendChild(el('b', '', String(d)));
        rd.appendChild(el('small', '', '周' + WEEK_CN[dt.getDay()]));
        row.appendChild(rd);
        var main = el('div', 'row-main');
        main.appendChild(el('b', '', f.name));
        if (f.note) main.appendChild(el('p', '', f.note));
        var meta = el('div', 'row-meta');
        meta.appendChild(el('span', 'tag cat', f.cat));
        (f.tags || []).forEach(function (t) { if (t !== '冷门') meta.appendChild(el('span', 'tag', t)); });
        main.appendChild(meta);
        row.appendChild(main);
        wrap.appendChild(row);
      });
    }
    if (!count) wrap.appendChild(el('div', 'empty', '本月没有匹配的节日'));

    host.appendChild(wrap);
  }

  function listRow(ev, key, diff) {
    var row = el('div', 'row');
    var d = ES.dateOf(key);
    var rd = el('div', 'row-date');
    rd.appendChild(el('b', '', String(d.getDate())));
    rd.appendChild(el('small', '', (d.getMonth() + 1) + '月'));
    row.appendChild(rd);

    var main = el('div', 'row-main');
    var years = ES.anniversaryYears(ev, key);
    var title = el('b', '', (ev.category === 'birthday' ? '🎂 ' : ev.category === 'anniversary' ? '❤ ' : '') + ev.title);
    if (ev.color && ev.color !== AUTO_COLOR) title.style.color = ev.color;
    main.appendChild(title);
    if (ev.note) main.appendChild(el('p', '', ev.note));
    var meta = el('div', 'row-meta');
    meta.appendChild(el('span', 'tag cat', ES.CATEGORY_LABEL[ev.category] || ''));
    meta.appendChild(el('span', 'tag', ES.repeatText(ev)));
    if (years) meta.appendChild(el('span', 'tag', '第 ' + years + ' 年'));
    if (diff !== undefined) {
      meta.appendChild(el('span', 'tag', diff === 0 ? '今天' : diff + ' 天后'));
    }
    if (ev.calendar === 'lunar') {
      var l = L.fromSolar(d.getFullYear(), d.getMonth() + 1, d.getDate());
      if (l) meta.appendChild(el('span', 'tag', '农历' + l.monthCn + l.dayCn));
    }
    (ev.tags || []).forEach(function (t) { meta.appendChild(el('span', 'tag', '#' + t)); });
    main.appendChild(meta);
    row.appendChild(main);

    var actions = el('div', 'row-actions');
    var edit = el('button', 'btn ghost small', '编辑');
    edit.addEventListener('click', function () { openEditor(ev); });
    actions.appendChild(edit);
    row.appendChild(actions);
    return row;
  }

    head.appendChild(el('span', 'big', String(d.getDate())));

      alm.yi.forEach(function (x) { yiRow.appendChild(el('span', 'alm-item', x)); });
      almanacBox.appendChild(yiRow);

      alm.ji.forEach(function (x) { jiRow.appendChild(el('span', 'alm-item', x)); });
      almanacBox.appendChild(jiRow);
      almanacBox.appendChild(el('p', 'hint', '依据：建除十二神 / 黄黑道十二神 / 二十八宿 / 四离四绝 / 杨公忌日等通书规则推算，不同流派或有差异，仅供参考。'));
      body.appendChild(almanacBox);

    // ---- 历史上的今天 ----
    var hist = historyOf(key);

      t.appendChild(el('b', '', ev.title + (years ? '（' + years + '周年）' : '')));

  /* ---------------- 编辑弹窗 ---------------- */
  var editingId = null;

  function openEditor(ev, presetKey) {
    editingId = ev ? ev.id : null;
    $('modalTitle').textContent = ev ? '编辑日程' : '新建日程';
    $('fId').value = ev ? ev.id : '';
    $('fTitle').value = ev ? ev.title : '';
    $('fCategory').value = ev ? ev.category : 'memo';
    $('fCalendar').value = ev ? ev.calendar : 'solar';
    $('fDate').value = ev ? ev.date : (presetKey || state.selected || ES.todayKey());
    $('fRepeat').value = ev ? ev.repeat : 'none';
    $('fTags').value = ev ? (ev.tags || []).join(', ') : '';
    $('fNote').value = ev ? ev.note : '';
    $('fColor').value = ev && ev.color && ev.color !== AUTO_COLOR ? ev.color : '#4c8bf5';
    $('fAutoColor').checked = !(ev && ev.color && ev.color !== AUTO_COLOR);
    $('fColor').disabled = $('fAutoColor').checked;
    $('fRemind').value = String(ev ? (ev.remindDays || 0) : 0);
    $('btnDelete').hidden = !ev;
    updatePreview();
    showModal('modal');
    setTimeout(function () { $('fTitle').focus(); }, 30);
  }

  function updatePreview() {
    var dateStr = $('fDate').value;
    var calendar = $('fCalendar').value;
    var repeat = $('fRepeat').value;
    var out = [];
    if (dateStr) {
      var p = dateStr.split('-');
      var l = L.fromSolar(+p[0], +p[1], +p[2]);
      if (l) out.push('公历 ' + dateStr + '，对应农历 ' + l.monthCn + l.dayCn + (l.term ? '，' + l.term : ''));
      if (calendar === 'lunar') {
        out.push('农历重复：每年农历 ' + (l ? l.monthCn : '') + (l ? l.dayCn : ''));
      }
    }
    if (repeat === 'yearly' || repeat === 'lunarYearly') {
      var d = ES.dateOf(dateStr);
      var next = ES.nextOccurrence(ES.create({ title: 'x', date: dateStr, repeat: repeat, calendar: calendar }), ES.todayKey());
      if (next) out.push('下次：' + next + '（' + ES.daysUntil(ES.create({ title: 'x', date: dateStr, repeat: repeat, calendar: calendar }), ES.todayKey()) + ' 天后）');
    }
    $('fPreview').textContent = out.join(' ｜ ');
  }

  function submitForm(e) {
    e.preventDefault();
    var title = $('fTitle').value.trim();
    if (!title) { toast('请填写标题'); return; }
    var tags = $('fTags').value.split(/[,，、\s]+/).filter(Boolean);
    var data = {
      title: title,
      category: $('fCategory').value,
      calendar: $('fCalendar').value,
      date: $('fDate').value,
      repeat: $('fRepeat').value,
      tags: tags,
      note: $('fNote').value.trim(),
      color: $('fAutoColor').checked ? AUTO_COLOR : $('fColor').value,
      remindDays: +$('fRemind').value || 0
    };
    if (editingId) {
      var ev = state.events.find(function (x) { return x.id === editingId; });
      if (ev) Object.assign(ev, data);
      toast('已保存修改');
    } else {
      state.events.push(ES.create(data));
      toast('已添加：' + title);
    }
    saveEvents();
    closeModals();
    render();
  }

  function deleteEditing() {
    if (!editingId) return;
    var ev = state.events.find(function (x) { return x.id === editingId; });
    if (!ev) return;
    if (!confirm('删除“' + ev.title + '”？')) return;
    state.events = state.events.filter(function (x) { return x.id !== editingId; });
    saveEvents();
    closeModals();
    render();
    toast('已删除');
  }

  /* ---------------- 弹窗控制 ---------------- */
  function showModal(id) {
    closeModals();
    $(id).hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function closeModals() {
    ['modal', 'dataModal', 'dayModal'].forEach(function (id) { $(id).hidden = true; });
    document.body.style.overflow = '';
  }

  /* ---------------- 数据管理 ---------------- */
  function openData() {
    var all = DB.all();
    var cats = DB.categories();
    $('festivalStat').textContent = '内置 ' + all.length + ' 条节日 / 纪念日，覆盖 ' + cats.length + ' 个类别；'
      + '其中冷门国际日 ' + all.filter(isRare).length + ' 条。';
    renderFestivalSearch('');
    showModal('dataModal');
  }

  function renderFestivalSearch(q) {
    var host = $('festivalResult');
    host.innerHTML = '';
    q = (q || '').trim().toLowerCase();
    if (!q) { return; }
    var y = new Date().getFullYear();
    var hits = [];
    for (var m = 1; m <= 12; m++) {
      var days = L.solarMonthDays(y, m);
      for (var d = 1; d <= days; d++) {
        DB.forDate({ year: y, month: m, day: d }).forEach(function (f) {
          if (f.name.toLowerCase().indexOf(q) >= 0 || (f.note || '').toLowerCase().indexOf(q) >= 0) {
            hits.push({ m: m, d: d, f: f });
          }
        });
      }
    }
    if (!hits.length) {
      host.appendChild(el('p', 'hint', '没有找到匹配的节日（当前检索 ' + y + ' 年）。'));
      return;
    }
    hits.slice(0, 60).forEach(function (h) {
      var row = el('div', 'festival-item');
      row.appendChild(el('span', 'when', h.m + '月' + h.d + '日'));
      row.appendChild(el('span', 'nm', h.f.name));
      row.appendChild(el('span', 'tag', h.f.cat));
      host.appendChild(row);
    });
  }

  function download(filename, text, type) {
    var blob = new Blob([text], { type: type || 'application/json;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  function exportJson() {
    download('calendar-events-' + ES.todayKey() + '.json', ES.toJSON(state.events));
    toast('已导出 ' + state.events.length + ' 条');
  }

  function exportCsv() {
    var rows = [['标题', '类型', '日期', '历法', '重复', '标签', '备注', '提前提醒(天)']];
    state.events.slice().sort(ES.compare).forEach(function (e) {
      rows.push([
        e.title,
        ES.CATEGORY_LABEL[e.category] || e.category,
        e.date,
        e.calendar === 'lunar' ? '农历' : '公历',
        ES.REPEAT_LABEL[e.repeat] || e.repeat,
        (e.tags || []).join('|'),
        e.note || '',
        String(e.remindDays || 0)
      ]);
    });
    var csv = '\ufeff' + rows.map(function (r) {
      return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(',');
    }).join('\r\n');
    download('calendar-events-' + ES.todayKey() + '.csv', csv, 'text/csv;charset=utf-8');
    toast('已导出 CSV');
  }

  function importJson(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var list = ES.fromJSON(String(reader.result));
        var before = state.events.length;
        var ids = {};
        state.events.forEach(function (e) { ids[e.id] = true; });
        var added = 0;
        list.forEach(function (e) { if (!ids[e.id]) { state.events.push(e); added++; } });
        saveEvents();
        render();
        toast('导入完成：新增 ' + added + ' 条（原有 ' + before + ' 条）');
      } catch (err) {
        toast('导入失败：文件格式不正确');
      }
    };
    reader.readAsText(file, 'utf-8');
  }

  function loadDemo() {
    var y = new Date().getFullYear();
    var demo = [
      ES.create({ title: '小林生日', category: 'birthday', date: (y - 24) + '-05-12', repeat: 'yearly', note: '喜欢机械键盘', tags: ['朋友'], color: '#e0567a' }),
      ES.create({ title: '妈妈生日', category: 'birthday', calendar: 'lunar', date: (y - 1) + '-09-18', repeat: 'lunarYearly', note: '农历生日，记得视频' }),
      ES.create({ title: '结婚纪念日', category: 'anniversary', date: (y - 5) + '-10-01', repeat: 'yearly' }),
      ES.create({ title: '交房租', category: 'memo', date: y + '-' + L.pad2(new Date().getMonth() + 1) + '-10', repeat: 'monthly' }),
      ES.create({ title: '每周复盘', category: 'todo', date: ES.todayKey(), repeat: 'weekly' }),
      ES.create({ title: '体检预约', category: 'todo', date: ES.keyOfDayNo(ES.dayNoOf(ES.todayKey()) + 21), repeat: 'none', note: '空腹，带上医保卡' })
    ];
    state.events = state.events.concat(demo);
    saveEvents();
    render();
    toast('已载入 ' + demo.length + ' 条示例');
  }

  /* ---------------- 搜索 ---------------- */
  function onSearch() {
    state.query = $('searchInput').value;
    render();
    if (state.query.trim() && state.view === 'month') {
      var hits = document.querySelectorAll('.day.match').length;
      $('statusHint').textContent = hits ? '高亮 ' + hits + ' 天包含“' + state.query.trim() + '”' : '没有匹配的日期';
    }
  }

  /* ---------------- 视图切换 ---------------- */
  function setView(v) {
    state.view = v;
    Array.prototype.forEach.call(document.querySelectorAll('.seg'), function (b) {
      b.setAttribute('aria-selected', String(b.dataset.view === v));
    });
    var monthMode = v === 'month';
    $('grid').hidden = !monthMode;
    $('weekdays').hidden = !monthMode;
    $('viewHost').hidden = monthMode;
    render();
  }

  function shiftMonth(delta) {
    var m = state.month + delta;
    var y = state.year;
    while (m < 1) { m += 12; y--; }
    while (m > 12) { m -= 12; y++; }
    if (y < L.MIN_YEAR) { y = L.MIN_YEAR; m = 1; }
    if (y > L.MAX_YEAR) { y = L.MAX_YEAR; m = 12; }
    state.year = y; state.month = m;
    if (state.view === 'year' || state.view === 'list') setView('month');
    else render();
  }

  function goToday() {
    var now = new Date();
    state.year = now.getFullYear();
    state.month = now.getMonth() + 1;
    state.selected = ES.todayKey();
    if (state.view !== 'month') setView('month'); else render();
  }

  /* ---------------- Toast ---------------- */
  var toastTimer = null;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 2200);
  }

  /* ---------------- 渲染入口 ---------------- */
  function render() {
    updateHeader();
    if (state.view === 'month') renderMonth();
    else if (state.view === 'year') renderYear();
    else renderList();
    renderSidebar();
    renderMobilePanel();
    if (!state.query) {
      $('statusHint').textContent = '点击日期格子添加日程；← → 切换月份，T 回到今天，N 新建';
    }
  }

  /* ---------------- 事件绑定 ---------------- */
  function bind() {
    $('btnPrev').addEventListener('click', function () { shiftMonth(-1); });
    $('btnNext').addEventListener('click', function () { shiftMonth(1); });
    $('btnToday').addEventListener('click', goToday);
    $('btnAdd').addEventListener('click', function () { openEditor(null, state.selected); });
    $('btnData').addEventListener('click', openData);
    $('searchInput').addEventListener('input', onSearch);

    Array.prototype.forEach.call(document.querySelectorAll('.seg'), function (b) {
      b.addEventListener('click', function () { setView(b.dataset.view); });
    });

    $('eventForm').addEventListener('submit', submitForm);
    $('btnDelete').addEventListener('click', deleteEditing);
    $('fAutoColor').addEventListener('change', function () {
      $('fColor').disabled = $('fAutoColor').checked;
    });
    ['fDate', 'fCalendar', 'fRepeat'].forEach(function (id) {
      $(id).addEventListener('change', updatePreview);
      $(id).addEventListener('input', updatePreview);
    });

    // 弹窗关闭
    document.querySelectorAll('[data-close]').forEach(function (n) {
      n.addEventListener('click', closeModals);
    });

    // 设置
    var map = {
      setLunar: 'lunar', setAlmanac: 'almanac', setHistory: 'history', setFestivals: 'festivals', setRare: 'rare',
      setWeekNumbers: 'weekNumbers', setDense: 'dense'
    };
    Object.keys(map).forEach(function (id) {
      $(id).addEventListener('change', function () {
        state.settings[map[id]] = $(id).checked;
        saveSettings();
        render();
      });
    });
    $('setWeekStart').addEventListener('change', function () {
      state.settings.weekStart = $('setWeekStart').checked ? 1 : 0;
      saveSettings();
      render();
    });

    $('btnExport').addEventListener('click', exportJson);
    $('btnExportCsv').addEventListener('click', exportCsv);
    $('importFile').addEventListener('change', function (e) {
      if (e.target.files && e.target.files[0]) importJson(e.target.files[0]);
      e.target.value = '';
    });
    $('btnDemo').addEventListener('click', loadDemo);
    $('btnClear').addEventListener('click', function () {
      if (!confirm('确定清空全部 ' + state.events.length + ' 条日程？此操作不可撤销。')) return;
      state.events = [];
      saveEvents();
      render();
      toast('已清空');
    });
    $('festivalQuery').addEventListener('input', function (e) { renderFestivalSearch(e.target.value); });

    // 键盘
    document.addEventListener('keydown', function (e) {
      var tag = (e.target.tagName || '').toLowerCase();
      var typing = tag === 'input' || tag === 'textarea' || tag === 'select';
      if (e.key === 'Escape') { closeModals(); return; }
      if (typing) return;
      if (e.key === 'ArrowLeft') shiftMonth(-1);
      else if (e.key === 'ArrowRight') shiftMonth(1);
      else if (e.key === 't' || e.key === 'T') goToday();
      else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openEditor(null, state.selected); }
      else if (e.key === '/') { e.preventDefault(); $('searchInput').focus(); }
    });

    // 触摸滑动切换月份
    var startX = 0, startY = 0;
    $('grid').addEventListener('touchstart', function (e) {
      startX = e.touches[0].clientX; startY = e.touches[0].clientY;
    }, { passive: true });
    $('grid').addEventListener('touchend', function (e) {
      var dx = e.changedTouches[0].clientX - startX;
      var dy = e.changedTouches[0].clientY - startY;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) shiftMonth(dx < 0 ? 1 : -1);
    }, { passive: true });

    // 跟随系统深色模式（仅在用户还没保存过设置时）
    if (window.matchMedia) {
      try {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        if (mq.matches && !storageGet(LS_SETTINGS)) state.settings.theme = 'dark';
      } catch (e) { /* 忽略 */ }
    }
  }

  /** 数据只能存在内存里时，明确告诉用户（不阻塞使用） */
  var memoryNoteShown = false;
  function noteMemoryOnly() {
    if (memoryNoteShown) return;
    memoryNoteShown = true;
    render();
    toast('日历已就绪；但当前无法保存数据，详见底部说明');
  }

  /* ---------------- 启动 ---------------- */
  function boot() {
    // 1) 先把界面渲染出来——任何存储问题都不应该阻止日历显示
    try {
      loadAll();
    } catch (e) {
      state.events = [];
    }
    try {
      bind();
    } catch (e) {
      // 个别事件绑定失败也不能让整个页面卡住
      if (window.console && console.error) console.error('初始化事件绑定出错：', e);
    }

    var now = new Date();
    state.year = now.getFullYear();
    state.month = now.getMonth() + 1;
    state.selected = ES.todayKey();
    render();

    // 2) 存储不可用时给出可见提示（不阻塞使用）
    if (!storage.ok) noteMemoryOnly();

    // 3) 首次访问放一条引导用的示例日程
    try {
      if (!storageGet(LS_SEEDED) && state.events.length === 0) {
        storageSet(LS_SEEDED, '1');
        state.events.push(ES.create({
          title: '试着在这里记一件每年都要记得的事',
          category: 'memo',
          date: now.getFullYear() + '-' + L.pad2(now.getMonth() + 1) + '-' + L.pad2(now.getDate()),
          repeat: 'yearly',
          note: '点“编辑”可以看到重复规则：每年 / 每月 / 每周 / 农历每年'
        }));
        saveEvents();
        render();
        if (storage.ok) toast('欢迎使用！点“数据 → 载入示例数据”看更多玩法');
      }
    } catch (e) { /* 引导内容失败无所谓 */ }
  }

  function safeBoot() {
    try {
      boot();
    } catch (e) {
      // 兜底：即使初始化局部失败，也要让日历可交互，并把原因留给页面上的启动自检显示
      window.__calendarError = (e && (e.stack || e.message)) || String(e);
      if (window.console && console.error) console.error('启动出错：', e);
      try {
        render();
        toast('初始化遇到问题（' + (e.message || e) + '），日历仍可使用');
      } catch (e2) { /* 放弃 */ }
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', safeBoot);
  else safeBoot();

  // 暴露给调试
  window.__calendar = { state: state, render: render, ES: ES, L: L, DB: DB, storage: storage };
})();

</script>
</body>
</html>
